{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Company Information</h2>
    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" class="form-control" value="{{ company.title }}" required>
        </div>

        <div class="form-group">
            <label>GST Number</label>
            <input type="text" name="gst_number" class="form-control" value="{{ company.gst_number }}" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone_number" class="form-control" value="{{ company.phone_number }}">
        </div>
        <div class="form-group">
            <label>Address</label>
            <textarea name="address" class="form-control">{{ company.address }}</textarea>
        </div>
        <div class="form-group mt-2">
            <label>Logo</label>
            <input type="file" name="logo" class="form-control">
            {% if company.logo %}
            <div class="mt-2">
                <img src="{{ url_for('static', filename=company.logo) }}" alt="Logo" style="max-height: 80px;">
            </div>
            {% endif %}
        </div>
        <button type="submit" class="btn btn-primary mt-2">Update</button>
    </form>
</div>
{% endblock %}
