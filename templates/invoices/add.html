{% extends 'base.html' %}
{% block title %}Create Invoice{% endblock %}
{% block content %}
<h2>Create Invoice</h2>
<form method="post">
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Customer Name</label>
      <input type="text" name="customer_name" class="form-control" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">GSTIN</label>
      <input type="text" name="customer_gstin" class="form-control">
    </div>
    <div class="col-md-4">
      <label class="form-label">Address</label>
      <input type="text" name="customer_address" class="form-control">
    </div>
  </div>
  <h5>Products</h5>
  <div id="products-list">
    <div class="row mb-2 product-row">
      <div class="col-md-5">
        <select name="product_id" class="form-select" required>
          <option value="">Select Product</option>
          {% for product in products %}
          <option value="{{ product.id }}">{{ product.name }} (GST: {{ product.gst_percent }}%)</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <input type="number" name="quantity" class="form-control" min="1" value="1" required>
      </div>
      <div class="col-md-2">
        <button type="button" class="btn btn-danger remove-product">Remove</button>
      </div>
    </div>
  </div>
  <button type="button" class="btn btn-secondary mb-3" id="add-product">Add Another Product</button>
  <div>
    <button type="submit" class="btn btn-primary">Create Invoice</button>
    <a href="{{ url_for('invoices.list_invoices') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('add-product').onclick = function() {
  var row = document.querySelector('.product-row').cloneNode(true);
  row.querySelector('select').value = '';
  row.querySelector('input').value = 1;
  document.getElementById('products-list').appendChild(row);
};
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('remove-product')) {
    var rows = document.querySelectorAll('.product-row');
    if (rows.length > 1) {
      e.target.closest('.product-row').remove();
    }
  }
});
</script>
{% endblock %}
