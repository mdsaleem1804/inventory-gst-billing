{% extends 'base.html' %}
{% block content %}
<div class="mt-4">
    <h2>Customers</h2>
    <form method="post" class="row g-2 mb-3">
        <input type="hidden" name="id" value="{{ form_customer.id if form_customer else '' }}">
        <div class="col-md-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required value="{{ form_customer.name if form_customer else '' }}">
        </div>
        <div class="col-md-3">
            <label>GSTIN</label>
            <input type="text" name="gstin" class="form-control" value="{{ form_customer.gstin if form_customer else '' }}">
        </div>
        <div class="col-md-4">
            <label>Address</label>
            <input type="text" name="address" class="form-control" value="{{ form_customer.address if form_customer else '' }}">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary">{{ 'Update' if form_customer else 'Add' }}</button>
            {% if form_customer %}
            <a href="{{ url_for('customers.crud_customers') }}" class="btn btn-secondary ms-2">Cancel</a>
            {% endif %}
        </div>
    </form>
    <!-- Search form -->
        <form method="get" class="row g-3 align-items-end mb-3">
            <div class="col-md-6">
                <input type="text" name="search" class="form-control" style="min-width:350px;max-width:100%;" placeholder="Search customer name, GSTIN..." value="{{ search|default('') }}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Search</button>
            </div>
        </form>
    <table class="table table-bordered table-hover w-100">
        <thead>
            <tr>
                <th>Name</th>
                <th>GSTIN</th>
                <th>Address</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr>
                <td>{{ customer.name }}</td>
                <td>{{ customer.gstin }}</td>
                <td>{{ customer.address }}</td>
                <td>
                    <a href="?edit_id={{ customer.id }}" class="btn btn-sm btn-warning">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
