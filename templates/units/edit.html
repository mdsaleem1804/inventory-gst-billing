{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Unit</h2>
    <form method="post" class="row g-3 mb-4">
        <div class="col-md-5">
            <input type="text" name="name" class="form-control" value="{{ unit.name }}" required>
        </div>
        <div class="col-md-3">
            <input type="text" name="abbreviation" class="form-control" value="{{ unit.abbreviation }}" required>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary">Update Unit</button>
            <a href="{{ url_for('units.list_units') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
